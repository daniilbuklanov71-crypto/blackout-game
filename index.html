#ov h1{margin:0;font-size:38px;color:#ef5a40}
#ov p{margin:0;font-size:18px;line-height:1.4;max-width:380px}
.go{border:0;border-radius:14px;background:#ef5a40;color:#fff;font-size:20px;font-weight:700;padding:15px 40px}
.ring{position:fixed;width:100px;height:100px;border:2px solid #fff6;border-radius:50%;display:none;pointer-events:none;margin:-50px 0 0 -50px}
.ring i{position:absolute;left:30px;top:30px;width:40px;height:40px;border-radius:50%;background:#fff6}

.bar{width:130px;height:10px;background:#0009;border-radius:5px;overflow:hidden;margin-top:2px}.bar i{display:block;height:100%;width:100%}
#acts{position:fixed;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);display:flex;flex-direction:column;gap:10px}
.ab{border-radius:14px;background:#000b;color:#fff;font-size:16px;font-weight:700;padding:12px 16px;border:1px solid #fff5;display:none;-webkit-touch-callout:none}
.ab:disabled{opacity:.35}
#card{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:56px;font-weight:800;color:#ef5a40;opacity:0;transition:opacity 1s;pointer-events:none;letter-spacing:2px}
</style>
</head>

<div id="card"></div>

var fl0=new THREE.Mesh(new THREE.PlaneGeometry(12,10),new THREE.MeshStandardMaterial({map:wood,roughness:.5}));fl0.rotation.x=-Math.PI/2;sc.add(fl0);
var ce=new THREE.Mesh(new THREE.PlaneGeometry(12,10),M(0xeeeeee));ce.rotation.x=Math.PI/2;ce.position.y=3;sc.add(ce);
// стены
var wB=0xc9bfd8,wL=0xdccfb4;
box(0,5,12,.2,3,wL);box(-6,0,.2,10,3,wB);box(6,0,.2,10,3,wL);
// задняя стена с окном
box(-2.6,-5,6.8,.2,3,wB,false);box(5.1,-5,1.8,.2,3,wL,false);box(2.5,-5,3.4,.2,.9,wL,false);box(2.5,-5,3.4,.2,.5,wL,false,2.5);
cols.push([-6,6,-5.1,-4.9]);
// рама окна, шторы, стекло
box(2.5,-4.9,.06,.06,1.6,0xf2f2f2,false,.9);box(2.5,-4.9,3.4,.06,.06,0xf2f2f2,false,1.7);
box(2.5,-4.85,3.6,.14,.06,0xf2f2f2,false,.85);
box(.75,-4.75,.6,.1,2.4,0x7a3a4a,false);box(4.25,-4.75,.6,.1,2.4,0x7a3a4a,false);
var glass=new THREE.Mesh(new THREE.PlaneGeometry(3.4,1.6),new THREE.MeshBasicMaterial({color:0x99bbdd,transparent:true,opacity:.07,depthWrite:false}));glass.position.set(2.5,1.7,-4.95);sc.add(glass);
// внутренняя стена с дверным проёмом
box(0,-3,.2,4,3,0xcfc6b0);box(0,3,.2,4,3,0xcfc6b0);box(0,0,.2,2,.6,0xcfc6b0,false,2.4);
box(0,-1.05,.28,.1,2.4,0x4a2e1a,false);box(0,1.05,.28,.1,2.4,0x4a2e1a,false);box(0,0,.28,2.1,.1,0x4a2e1a,false,2.4);
// плинтусы
[[0,4.88,11.8,.06],[-5.88,0,.06,9.8],[5.88,0,.06,9.8],[0,-4.88,11.8,.06]].forEach(function(b){box(b[0],b[1],b[2],b[3],.12,0xffffff,false)});
// картины
function pic(x,y,z,w,h,c,ry){var m=box(x,z,w,.04,h,0x222222,false,y);if(ry)m.rotation.y=ry;var p=new THREE.Mesh(new THREE.PlaneGeometry(w-.1,h-.1),new THREE.MeshStandardMaterial({color:c,roughness:.9}));p.position.set(x,y+h/2,z+(ry?0:.03));if(ry){p.rotation.y=ry;p.position.x=x+(ry>0?.03:-.03)}sc.add(p)}
pic(-4.2,1.3,-4.86,1.2,.8,0x3a7a9a);pic(-5.88,1.5,-1,.9,.7,0xd08a3a,Math.PI/2);pic(5.88,1.6,3.4,.9,.7,0x5a9a5a,-Math.PI/2);
// СПАЛЬНЯ
box(-4.2,-3.4,2.2,3,.5,0x5a3d2a);box(-4.2,-3.4,2.1,2.9,.15,0xe6e0d4,false,.5);
box(-4.2,-2.4,2.15,1.8,.12,0x3a4f8a,false,.55);box(-4.2,-4.3,1.4,.5,.15,0xffffff,false,.65);
box(-4.2,-4.85,2.4,.15,1.2,0x5a3d2a);
box(-2.5,-4.4,.6,.6,.6,0x7a5a3a);
box(-5.5,1.8,.8,2.4,2.2,0x6a4a2e);box(-5.07,1.8,.04,.04,1.6,0x222222,false,.3);
box(-3,3.8,1.6,.7,.9,0x8a6a44);box(-3,3.0,.45,.45,.5,0x333333);box(-3,2.8,.45,.06,.5,0x333333,false,.5);
var rug=box(-3,0,2.6,3.2,.02,0x3a5a7a,false,.011);
// ГОСТИНАЯ / КУХНЯ
box(3,2.8,3,1,.5,0x8a3a3a);box(3,2.3,3,.3,.9,0x7a3030,false);box(1.5,2.8,.3,1,.7,0x7a3030,false);box(4.5,2.8,.3,1,.7,0x7a3030,false);
box(2.4,2.75,.8,.8,.12,0x9a4a4a,false,.5);box(3.6,2.75,.8,.8,.12,0x9a4a4a,false,.5);
box(3,4.55,2.2,.5,.5,0x2a2a2a);box(3,4.7,1.7,.08,.95,0x0c0c0c,false,.55);
var scr=new THREE.Mesh(new THREE.PlaneGeometry(1.6,.85),new THREE.MeshBasicMaterial({color:0x6aa0ff}));scr.position.set(3,1.03,4.655);scr.rotation.y=Math.PI;sc.add(scr);
box(3,.6,1.4,.7,.45,0x7a5a3a);box(3,1.0,3.4,3.0,.02,0xb8a888,false,.011);
box(3.5,-2.2,1.2,1.2,.75,0x8a6a44);box(2.4,-2.2,.45,.45,.5,0x333333);box(4.6,-2.2,.45,.45,.5,0x333333);
box(5.55,-1.5,.8,3,1,0x8a8a8a);box(5.55,-1.5,.82,3.02,.05,0x333333,false,1);box(5.7,-1.5,.4,3,.7,0x6a6a6a,false,1.6);
box(5.45,2.0,.9,.9,2,0xeeeeee);box(4.97,2.0,.04,.04,.8,0x888888,false,.9);
box(5.4,4.4,.5,.5,.4,0x7a4a2a);var leaf=new THREE.Mesh(new THREE.SphereGeometry(.45,10,8),M(0x2f7a3a));leaf.position.set(5.4,.95,4.4);sc.add(leaf);
box(1.0,4.4,.08,.08,1.5,0x333333,false);var sh=new THREE.Mesh(new THREE.ConeGeometry(.3,.35,12,1,true),new THREE.MeshStandardMaterial({color:0xf0e0b0,side:THREE.DoubleSide}));sh.position.set(1.0,1.6,4.4);sc.add(sh);

// 3D ГОРОД ЗА ОКНОМ
function facade(on,s){var c=document.createElement('canvas');c.width=32;c.height=64;var g=c.getContext('2d');
  g.fillStyle=on?['#121c3e','#17224a','#101830','#1a2040'][s]:'#04060d';g.fillRect(0,0,32,64);
  for(var y=0;y<16;y++)for(var x=0;x<6;x++){if(on&&Math.random()>.45){g.fillStyle=Math.random()>.2?'#f5c850':'#9fd0ff';g.fillRect(x*5+2,y*4+1,3,2)}else if(!on&&Math.random()>.97){g.fillStyle='#08101c';g.fillRect(x*5+2,y*4+1,3,2)}}
  var t=new THREE.CanvasTexture(c);t.magFilter=THREE.NearestFilter;return new THREE.MeshBasicMaterial({map:t})}
var fOn=[0,1,2,3].map(function(i){return facade(true,i)}),fOff=[0,1,2,3].map(function(i){return facade(false,i)});
var bl=[],beac=[];
for(var i=0;i<90;i++){
  var z=-14-Math.random()*70,w=3+Math.random()*5,h=6+Math.random()*(z<-40?55:30),x=-70+Math.random()*140;
  if(Math.abs(x-2.5)<w/2+2&&z>-20)continue;
  var v=Math.floor(Math.random()*4);
  var m=new THREE.Mesh(new THREE.BoxGeometry(w,h,3+Math.random()*5),fOn[v]);m.position.set(x,h/2-12,z);sc.add(m);bl.push({m:m,v:v});
  if(h>45){var r=new THREE.Mesh(new THREE.SphereGeometry(.4,6,6),new THREE.MeshBasicMaterial({color:0xff2222}));r.position.set(x,h-12+.5,z);sc.add(r);beac.push(r)}
}
var gnd=new THREE.Mesh(new THREE.PlaneGeometry(400,200),new THREE.MeshBasicMaterial({color:0x090d1a}));gnd.rotation.x=-Math.PI/2;gnd.position.set(0,-12,-60);sc.add(gnd);

// ПРЕДМЕТЫ
var items=[],inv={w:0,f:0,l:0};
function bottle(){
  var g=new THREE.Group(),gl=new THREE.MeshStandardMaterial({color:0x9fdcf5,roughness:.12,transparent:true,opacity:.8});
  function c(rt,rb,h,y,mat){var m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,14),mat);m.position.y=y;g.add(m)}
  c(.07,.07,.2,.1,gl);c(.035,.07,.07,.235,gl);c(.032,.032,.05,.295,gl);
  c(.036,.036,.035,.335,new THREE.MeshStandardMaterial({color:0x1976d2}));
  c(.0715,.0715,.07,.1,new THREE.MeshStandardMaterial({color:0xffffff}));
  return g}
function can(){
  var g=new THREE.Group();
  [[.1,.14,.07,0xc9ccd1],[.102,.08,.07,0xe8892a]].forEach(function(a){var m=new THREE.Mesh(new THREE.CylinderGeometry(a[0],a[0],a[1],14),M(a[3],.4));m.position.y=a[2];g.add(m)});
  return g}
function item(k,x,sy,z){
  var m;
  if(k==='w'){m=bottle();m.position.set(x,sy,z)}
  else if(k==='f'){m=can();m.position.set(x,sy,z)}
  else{m=new THREE.Mesh(new THREE.CylinderGeometry(.04,.04,.28,10),new THREE.MeshStandardMaterial({color:0xf5d020,emissive:0x553300,roughness:.4}));m.rotation.z=Math.PI/2;m.position.set(x,sy+.05,z);m.add(new THREE.PointLight(0xffcc66,.4,3))}
  sc.add(m);items.push({m:m,k:k,x:x,z:z});
}
item('w',-2.5,.6,-4.4);item('w',3,.46,.6);item('w',5.55,1.05,-1.0);item('w',-5.2,0,-1);
item('f',3.5,.75,-2.2);item('f',5.55,1.05,-2.2);item('f',-4.2,.7,-2.3);
var spots=[[-3.6,.9,3.8],[3.5,.62,2.5],[5.55,1.05,-.4]],sp=spots[Math.floor(Math.random()*3)];
item('l',sp[0],sp[1],sp[2]);
var flash=items[items.length-1];

// УПРАВЛЕНИЕ
var yaw=Math.PI,pitch=0,mv=null,lk=null,mx=0,my=0;
var ring=$('ring'),knob=$('knob');
addEventListener('touchstart',function(e){
  for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];
    if(e.target.closest&&e.target.closest('button'))continue;if(t.clientX<innerWidth/2&&!mv){mv={id:t.identifier,x:t.clientX,y:t.clientY};ring.style.display='block';ring.style.left=t.clientX+'px';ring.style.top=t.clientY+'px'}
    else if(!lk)lk={id:t.identifier,x:t.clientX,y:t.clientY};}
},{passive:false});
addEventListener('touchmove',function(e){
  e.preventDefault();
  for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];
    if(mv&&t.identifier===mv.id){var dx=t.clientX-mv.x,dy=t.clientY-mv.y,l=Math.hypot(dx,dy),m=50;
      if(l>m){dx*=m/l;dy*=m/l}mx=dx/m;my=dy/m;knob.style.transform='translate('+dx+'px,'+dy+'px)'}
    else if(lk&&t.identifier===lk.id){yaw-=(t.clientX-lk.x)*.006;pitch=Math.max(-1.1,Math.min(1.1,pitch-(t.clientY-lk.y)*.005));lk.x=t.clientX;lk.y=t.clientY}}
},{passive:false});
function tend(e){for(var i=0;i<e.changedTouches.length;i++){var t=e.changedTouches[i];
  if(mv&&t.identifier===mv.id){mv=null;mx=my=0;ring.style.display='none';knob.style.transform=''}
  if(lk&&t.identifier===lk.id)lk=null}}
addEventListener('touchend',tend);addEventListener('touchcancel',tend);
var keys={};addEventListener('keydown',function(e){keys[e.key.toLowerCase()]=1});addEventListener('keyup',function(e){keys[e.key.toLowerCase()]=0});

function ok(x,z){var r=.3;for(var i=0;i<cols.length;i++){var c=cols[i];if(x>c[0]-r&&x<c[1]+r&&z>c[2]-r&&z<c[3]+r)return false}return true}
function toast(t){var m=$('msg');m.textContent=t;m.style.opacity=1;clearTimeout(toast.t);toast.t=setTimeout(function(){m.style.opacity=0},2600)}
function hud(){$('it').textContent=state==='day'?'':'🍼'+inv.w+'/4  🥫'+inv.f+'/3  🔦'+inv.l+'/1'}

var state='menu',tl=120,NIGHT=100,nl=NIGHT,nn=1,last=0,ft=0,W=100,F=100,sitting=false,hintT=0,hudT=0,lowT=0;
function hud(){
  $('it').textContent=state==='day'?'':'🍼'+inv.w+'  🥫'+inv.f+'  🔦'+inv.l;
  $('wv').textContent=Math.round(W);$('fv').textContent=Math.round(F);
  $('wb').style.width=W+'%';$('fb').style.width=F+'%';
  $('bdr').disabled=!inv.w;$('bea').disabled=!inv.f;
}
function showCard(t){var c=$('card');c.textContent=t;c.style.opacity=1;setTimeout(function(){c.style.opacity=0},2400)}
function fade(){var d=$('dark');d.style.transition='none';d.style.opacity=1;setTimeout(function(){d.style.transition='opacity 1.5s';d.style.opacity=0},120)}
$('go').onclick=function(){
  $('ov').innerHTML='<p style="font-size:19px;line-height:1.5">Ты — <b>Джон</b>.<br><br>Вечер. Ты только что вернулся домой после смены — ты работаешь в гей-баре. Ноги гудят, в ушах ещё стоит музыка, а дома наконец тихо.<br><br>Хочется просто сесть на диван и включить телевизор.<br><br>Но сегодня ночью по всему миру выключат свет. И никто не знает, на сколько.</p><p style="color:#8b95b3;font-size:15px">Пока свет горит — осмотрись и запомни, где что лежит.<br>Левая половина экрана — идти, правая — смотреть.</p><button class="go" id="go2">Начать</button>';
  $('go2').onclick=function(){$('ov').style.display='none';state='day';last=performance.now();toast('Осмотрись и запомни, где что лежит')};
};
$('bdr').onclick=function(){if(inv.w>0&&state==='dark'){inv.w--;W=Math.min(100,W+40);hud()}};
$('bea').onclick=function(){if(inv.f>0&&state==='dark'){inv.f--;F=Math.min(100,F+45);hud()}};
$('bsit').onclick=function(){
  if(!sitting){sitting=true;cam.position.set(3,1.15,2.85);yaw=Math.PI;pitch=0}
  else{sitting=false;cam.position.set(3,1.6,1.6)}
};
function blackout(){
  state='dark';
  lamps.forEach(function(l){l.intensity=0});bulbs.forEach(function(b){b.material.color.set(0x111111)});
  amb.intensity=.05;moon.intensity=.5;sc.background.set(0x010206);
  scr.material.color.set(0x050505);gnd.material.color.set(0x020308);
  bl.forEach(function(b){b.m.material=fOff[b.v]});beac.forEach(function(r){r.visible=false});
  fade();$('bars').style.display='flex';$('bdr').style.display='block';$('bea').style.display='block';
  showCard('Ночь 1');hud();toast('ВЕСЬ ГОРОД ОБЕСТОЧЕН. Найди фонарик!');
}
function finish(why){
  state='end';$('acts').style.display='none';
  var o=$('ov');o.style.display='flex';
  o.innerHTML='<h1>НОЧЬ '+nn+'</h1><p>'+why+'</p><p>Пережито ночей: <b>'+(nn-1)+'</b></p><button class="go" id="go3">Играть снова</button>';
  $('go3').onclick=function(){location.reload()};
}
function loop(now){
  requestAnimationFrame(loop);
  var dt=Math.min((now-last)/1000,.05);last=now;
  if(state==='day'||state==='dark'){
    if(!sitting){
      var f=-my+(keys.w?1:0)-(keys.s?1:0),s=mx+(keys.d?1:0)-(keys.a?1:0);
      if(keys.arrowleft)yaw+=dt*2;if(keys.arrowright)yaw-=dt*2;
      var spd=2.6*dt,fx=-Math.sin(yaw),fz=-Math.cos(yaw),rx=Math.cos(yaw),rz=-Math.sin(yaw);
      var nx=cam.position.x+(fx*f+rx*s)*spd,nz=cam.position.z+(fz*f+rz*s)*spd;
      if(ok(nx,cam.position.z))cam.position.x=nx;if(ok(cam.position.x,nz))cam.position.z=nz;
      cam.position.y=1.6+Math.sin(now/200)*.02*Math.min(1,Math.abs(f)+Math.abs(s));
    }else cam.position.y=1.15;
    cam.rotation.y=yaw;cam.rotation.x=pitch;
    var near=!sitting&&Math.hypot(cam.position.x-3,cam.position.z-1.7)<1.4,sb=$('bsit');
    sb.style.display=(near||sitting)?'block':'none';sb.textContent=sitting?'Встать':'Сесть';
  }
  if(state==='day'){
    tl-=dt;var t=Math.max(0,Math.ceil(tl));$('tm').textContent=Math.floor(t/60)+':'+('0'+t%60).slice(-2);
    if(tl<6){ft+=dt;if(ft>.12){ft=0;var v=Math.random()>.5?1.1:.1;lamps.forEach(function(l){l.intensity=v})}}
    for(var j=0;j<items.length;j++)if(Math.hypot(items[j].x-cam.position.x,items[j].z-cam.position.z)<1.3&&now-hintT>5000){hintT=now;toast('Свет горит — запомни это место. Брать можно только после блэкаута.')}
    if(tl<=0)blackout();
  }else if(state==='dark'){
    nl-=dt;var q=Math.max(0,Math.ceil(nl));$('tm').textContent='Ночь '+nn+' · '+Math.floor(q/60)+':'+('0'+q%60).slice(-2);
    if(nl<=0){nn++;nl=NIGHT;fade();showCard('Ночь '+nn)}
    var k=sitting?.5:1;W=Math.max(0,W-.45*dt*k);F=Math.max(0,F-.3*dt*k);
    hudT+=dt;if(hudT>.2){hudT=0;hud()}
    lowT-=dt;if(lowT<=0&&(W<25||F<25)){lowT=12;toast(W<F?'Ты хочешь пить!':'Ты голоден!')}
    if(W<=0)finish('Джон не выдержал жажды.');else if(F<=0)finish('Джон ослаб от голода.');
    if(!inv.l){var pu=.25+.25*Math.sin(now/400);flash.m.children[0].intensity=pu;flash.m.material.emissiveIntensity=.5+Math.sin(now/300)*.5}
    for(var i=items.length-1;i>=0;i--){var it=items[i];
      if(Math.hypot(it.x-cam.position.x,it.z-cam.position.z)<1.4){
        sc.remove(it.m);items.splice(i,1);inv[it.k]++;hud();
        if(it.k==='l'){fl.intensity=2;toast('Фонарик! Теперь видно.')}else toast(it.k==='w'?'Вода +1':'Еда +1')}}
  }
  beac.forEach(function(r){r.visible=state==='day'&&Math.floor(now/600)%2===0});
  R.render(sc,cam);
}
hud();requestAnimationFrame(function(n){last=n;loop(n)});
</script>
